name: Version & Publish Packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Choose which release pipeline to run'
        required: false
        default: regular
        type: choice
        options:
          - regular
          - canary
  push:
    branches:
      - main

env:
  DO_NOT_TRACK: '1'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build-and-publish-to-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    env:
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_type || 'regular' }}
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Dependencies
        uses: ./.github/workflows/actions/install-dependencies
        with:
          rust-components: "rustfmt"
          install-rust: true

      - name: Install TS dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run format
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Cache codama-cli
        id: cache-codama
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/codama-rs
          key: codama-cli-0.8.0-${{ runner.os }}

      - name: Install codama-cli
        if: steps.cache-codama.outputs.cache-hit != 'true'
        working-directory: .
        run: cargo install codama-cli --version 0.8.0 --locked

      - name: Check committed IDL and SDKs match the program source
        working-directory: .
        run: |
          pnpm run generate-idl
          pnpm run generate-sdks
          if [ -n "$(git status --porcelain -- idl/ sdk/ts/src/generated sdk/rust/src/generated)" ]; then
            echo "::error::Committed IDL/SDKs are out of date. Run 'pnpm run generate-idl && pnpm run generate-sdks' and commit the result. Refusing to publish."
            git status --porcelain -- idl/ sdk/ts/src/generated sdk/rust/src/generated
            git diff -- idl/ sdk/ts/src/generated sdk/rust/src/generated
            exit 1
          fi

      - name: Create Changesets Pull Request or Trigger an npm Publish
        if: env.RELEASE_TYPE == 'regular'
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          createGithubReleases: true
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose final step
        if: env.RELEASE_TYPE == 'regular'
        id: build-step-decider
        run: |
          echo "step-name=${{ steps.changesets.outputs.hasChangesets == 'false' && 'publish' || 'build' }}" >> "$GITHUB_OUTPUT"

      - name: Run final step
        if: env.RELEASE_TYPE == 'regular'
        run: pnpm ${{ steps.build-step-decider.outputs.step-name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Canary Snapshot
        if: env.RELEASE_TYPE == 'canary'
        run: |
          pnpm changeset version --snapshot canary
          pnpm build
          pnpm changeset publish --tag canary --filter @solana/token-helpers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}