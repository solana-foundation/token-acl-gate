name: Rust Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


jobs:
  build:
    name: Run Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/workflows/actions/install-dependencies
        with:
          solana_version: "3.1.11"
          rust-components: "rustfmt, clippy"
          install-rust: true

      - name: Build Token-ACL-gate program
        run: pnpm run build:program

      - name: Build CLI
        run : pnpm run build:cli

      - name: Copy test artifacts to test fixtures
        run: pnpm run copy:test:fixtures

      - name: Run integration tests
        run: pnpm run test

      - name: Cache codama-cli
        id: cache-codama
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/codama-rs
          key: codama-cli-0.8.0-${{ runner.os }}

      - name: Install codama-cli
        if: steps.cache-codama.outputs.cache-hit != 'true'
        run: cargo install codama-cli --version 0.8.0 --locked

      - name: Check committed IDL, SDKs and test fixture match the program source
        run: |
          pnpm run generate-idl
          pnpm run generate-sdks
          # the earlier copy:test:fixtures step overwrote the committed fixture
          # with the freshly built program, so a dirty fixture path here means
          # the committed binary was not built from the current source (with
          # the CI-pinned Agave version)
          if [ -n "$(git status --porcelain -- idl/ sdk/ts/src/generated sdk/rust/src/generated sdk/rust/tests/fixtures/token_acl_gate_program.so)" ]; then
            echo "::error::Committed IDL/SDKs/test fixture are out of date. Run 'pnpm run generate-idl && pnpm run generate-sdks && pnpm run copy:test:fixtures' and commit the result."
            git status --porcelain -- idl/ sdk/ts/src/generated sdk/rust/src/generated sdk/rust/tests/fixtures/token_acl_gate_program.so
            git diff -- idl/ sdk/ts/src/generated sdk/rust/src/generated
            exit 1
          fi
