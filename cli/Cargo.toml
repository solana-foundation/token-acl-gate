[package]
name = "token-acl-gate-cli"
version = { workspace = true }
description = "A CLI app to interact with the Token ACL Gate smart contract on solana!"
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
clap = { version = "3", features = ["cargo"] }
solana-clap-v3-utils = { version = "^3", features = ["agave-unstable-api"] }
solana-cli-config = "^3"
solana-client = "^3"
solana-logger = "^3"
solana-remote-wallet = "^3"
tokio = { version = "1", features = ["full"] }
token-acl-gate-client = { workspace = true }
token-acl-client = { workspace = true }
token-acl-interface = { workspace = true }
solana-pubkey = { version = "^4", features = ["serde"] }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { version = "^3", features = ["serde"] }
solana-instruction = { workspace = true }
solana-commitment-config = { workspace = true }

[[bin]]
name = "token-acl-gate-cli"
path = "src/main.rs"